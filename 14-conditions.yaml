- name: gathering facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    ansible.builtin.debug:
      msg: | 
        " {{ ansible_facts.os_family }} "
        msg: {{ ansible_facts }}
  - name: check the OS is redhat or not
    ansible.builtin.debug:
      msg: "yes, package manager is Redhat"
    when: ansible_facts.os_family == "RedHat"
  
  - name: check the OS is Debian or not
    ansible.builtin.debug:
      msg: "yes, package manager is Debian"
    when: ansible_facts.os_family == "Debian" 

  - name: Check the OS is Darwin or not
    ansible.builtin.debug:
      msg: "yes, package mamager is Darwin"
    when: ansible_facts.os_family == "Darwin"